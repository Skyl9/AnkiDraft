<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="AnkiDraft workflow decision tree">
  <style>
    .q-root { fill: #0F1117; stroke: #4F46E5; stroke-width: 1.5; }
    .q-root-text { fill: #F6F5F0; font-family: Archivo, Inter, system-ui, sans-serif; font-size: 16px; font-weight: 800; }
    .q-sub { fill: #FFFFFF; stroke: #6366F1; stroke-width: 1.5; }
    .q-sub-alt { fill: #FFFFFF; stroke: #64748B; stroke-width: 1.5; }
    .q-sub-text { fill: #0F1117; font-family: Archivo, Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; }
    .pill-indigo { fill: #EEF2FF; stroke: #6366F1; stroke-width: 1.25; }
    .pill-indigo-text { fill: #3730A3; font-family: Inter, system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
    .pill-neutral { fill: #FFFFFF; stroke: #64748B; stroke-width: 1.25; }
    .pill-neutral-text { fill: #1E293B; font-family: Inter, system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
    .choice-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.25; }
    .choice-text { fill: #334155; font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    .card { fill: #FFFFFF; stroke: #6366F1; stroke-width: 1.5; }
    .card-alt { fill: #FFFFFF; stroke: #64748B; stroke-width: 1.5; }
    .card-kicker { fill: #4F46E5; font-family: Archivo, Inter, system-ui, sans-serif; font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; }
    .card-kicker-alt { fill: #475569; font-family: Archivo, Inter, system-ui, sans-serif; font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; }
    .card-title { fill: #0F1117; font-family: Archivo, Inter, system-ui, sans-serif; font-size: 14px; font-weight: 800; }
    .card-desc { fill: #525663; font-family: Inter, system-ui, sans-serif; font-size: 11.5px; }
    .footer-box { fill: #FFFFFF; stroke: #6366F1; stroke-width: 1.5; }
    .footer-title { fill: #0F1117; font-family: Archivo, Inter, system-ui, sans-serif; font-size: 13px; font-weight: 800; }
    .footer-text { fill: #334155; font-family: Inter, system-ui, sans-serif; font-size: 12px; }
    .footer-sub { fill: #64748B; font-family: Inter, system-ui, sans-serif; font-size: 11px; }
    .line-indigo { stroke: #6366F1; stroke-width: 2; fill: none; }
    .line-neutral { stroke: #64748B; stroke-width: 2; fill: none; }

    @media (prefers-color-scheme: dark) {
      .q-root { fill: #1E1B4B; stroke: #818CF8; }
      .q-sub, .q-sub-alt, .choice-box, .card, .card-alt, .footer-box { fill: #161922; }
      .q-sub, .card, .footer-box { stroke: #818CF8; }
      .q-sub-alt, .card-alt, .pill-neutral { stroke: #64748B; }
      .choice-box { stroke: #334155; }
      .q-sub-text, .card-title, .footer-title { fill: #F8FAFC; }
      .card-desc, .choice-text, .footer-text { fill: #CBD5E1; }
      .footer-sub { fill: #94A3B8; }
      .pill-indigo { fill: #1E1B4B; stroke: #818CF8; }
      .pill-indigo-text, .card-kicker { fill: #A5B4FC; }
      .pill-neutral { fill: #1E293B; }
      .pill-neutral-text, .card-kicker-alt { fill: #E2E8F0; }
      .line-indigo { stroke: #818CF8; }
      .line-neutral { stroke: #94A3B8; }
    }
  </style>

  <defs>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366F1" />
    </marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Question 1 -->
  <rect class="q-root" x="290" y="16" width="380" height="48" rx="6" />
  <text class="q-root-text" x="480" y="45" text-anchor="middle">Where are you starting from?</text>

  <!-- Level 1 branches -->
  <path class="line-neutral" d="M480 64 V86" />
  <path class="line-indigo" d="M480 86 H294 V98" />
  <path class="line-indigo" d="M294 124 V138" marker-end="url(#arrow-indigo)" />

  <path class="line-neutral" d="M480 86 H759 V98" />
  <path class="line-neutral" d="M759 124 V138" marker-end="url(#arrow-neutral)" />

  <!-- Level 1 pills -->
  <rect class="pill-indigo" x="189" y="98" width="210" height="26" rx="13" />
  <text class="pill-indigo-text" x="294" y="115" text-anchor="middle">I have new study material</text>

  <rect class="pill-neutral" x="654" y="98" width="210" height="26" rx="13" />
  <text class="pill-neutral-text" x="759" y="115" text-anchor="middle">I already have an Anki deck</text>

  <!-- Question 2A -->
  <rect class="q-sub" x="154" y="144" width="280" height="44" rx="6" />
  <text class="q-sub-text" x="294" y="171" text-anchor="middle">What are you studying?</text>

  <!-- Question 2B -->
  <rect class="q-sub-alt" x="619" y="144" width="280" height="44" rx="6" />
  <text class="q-sub-text" x="759" y="171" text-anchor="middle">What do you want to improve?</text>

  <!-- Sub-branches 2A -->
  <path class="line-indigo" d="M294 188 V210 H108 V224" />
  <path class="line-indigo" d="M108 250 V276" marker-end="url(#arrow-indigo)" />

  <path class="line-indigo" d="M294 188 V224" />
  <path class="line-indigo" d="M294 250 V276" marker-end="url(#arrow-indigo)" />

  <path class="line-indigo" d="M294 210 H480 V224" />
  <path class="line-indigo" d="M480 250 V276" marker-end="url(#arrow-indigo)" />

  <rect class="choice-box" x="34" y="224" width="148" height="26" rx="4" />
  <text class="choice-text" x="108" y="241" text-anchor="middle">PDF, Word, Web page</text>

  <rect class="choice-box" x="220" y="224" width="148" height="26" rx="4" />
  <text class="choice-text" x="294" y="241" text-anchor="middle">Vocabulary / Languages</text>

  <rect class="choice-box" x="406" y="224" width="148" height="26" rx="4" />
  <text class="choice-text" x="480" y="241" text-anchor="middle">YouTube or Audio</text>

  <!-- Sub-branches 2B -->
  <path class="line-neutral" d="M759 188 V210 H666 V224" />
  <path class="line-neutral" d="M666 250 V276" marker-end="url(#arrow-neutral)" />

  <path class="line-neutral" d="M759 210 H852 V224" />
  <path class="line-neutral" d="M852 250 V276" marker-end="url(#arrow-neutral)" />

  <rect class="choice-box" x="590" y="224" width="152" height="26" rx="4" />
  <text class="choice-text" x="666" y="241" text-anchor="middle">Unclear / duplicate cards</text>

  <rect class="choice-box" x="776" y="224" width="152" height="26" rx="4" />
  <text class="choice-text" x="852" y="241" text-anchor="middle">Missing textbook topics</text>

  <!-- 5 Workflow Cards -->
  <g transform="translate(24, 282)">
    <rect class="card" width="168" height="132" rx="6" />
    <rect x="16" y="14" width="32" height="4" rx="2" fill="#4F46E5" />
    <text class="card-kicker" x="16" y="34">01 · WORKFLOW</text>
    <text class="card-title" x="16" y="58">Written Docs</text>
    <text class="card-title" x="16" y="76">&amp; STEM</text>
    <text class="card-desc" x="16" y="100">Chapters, formulas,</text>
    <text class="card-desc" x="16" y="116">and diagrams</text>
  </g>

  <g transform="translate(210, 282)">
    <rect class="card" width="168" height="132" rx="6" />
    <rect x="16" y="14" width="32" height="4" rx="2" fill="#4F46E5" />
    <text class="card-kicker" x="16" y="34">02 · WORKFLOW</text>
    <text class="card-title" x="16" y="58">Languages &amp;</text>
    <text class="card-title" x="16" y="76">Pronunciation</text>
    <text class="card-desc" x="16" y="100">Spoken cards with</text>
    <text class="card-desc" x="16" y="116">offline voice</text>
  </g>

  <g transform="translate(396, 282)">
    <rect class="card" width="168" height="132" rx="6" />
    <rect x="16" y="14" width="32" height="4" rx="2" fill="#4F46E5" />
    <text class="card-kicker" x="16" y="34">03 · WORKFLOW</text>
    <text class="card-title" x="16" y="58">Video &amp;</text>
    <text class="card-title" x="16" y="76">Audio</text>
    <text class="card-desc" x="16" y="100">Local transcription</text>
    <text class="card-desc" x="16" y="116">&amp; key cards</text>
  </g>

  <g transform="translate(582, 282)">
    <rect class="card-alt" width="168" height="132" rx="6" />
    <rect x="16" y="14" width="32" height="4" rx="2" fill="#64748B" />
    <text class="card-kicker-alt" x="16" y="34">04 · WORKFLOW</text>
    <text class="card-title" x="16" y="58">Collection</text>
    <text class="card-title" x="16" y="76">Cleanup</text>
    <text class="card-desc" x="16" y="100">Duplicates, clarity,</text>
    <text class="card-desc" x="16" y="116">history preserved</text>
  </g>

  <g transform="translate(768, 282)">
    <rect class="card-alt" width="168" height="132" rx="6" />
    <rect x="16" y="14" width="32" height="4" rx="2" fill="#64748B" />
    <text class="card-kicker-alt" x="16" y="34">05 · COVERAGE</text>
    <text class="card-title" x="16" y="58">Fill Knowledge</text>
    <text class="card-title" x="16" y="76">Gaps</text>
    <text class="card-desc" x="16" y="100">Match cards against</text>
    <text class="card-desc" x="16" y="116">missed chapters</text>
  </g>

  <!-- Cross-cutting mode bar -->
  <rect class="footer-box" x="24" y="438" width="912" height="82" rx="6" />
  <text class="footer-title" x="480" y="463" text-anchor="middle">Applies to all 5 workflows — choose how you want to run it:</text>
  <text class="footer-text" x="480" y="486" text-anchor="middle">
    <tspan font-weight="700" fill="#4F46E5">Built-in Studio</tspan> (free offline Ollama, API key, or manual editing)
    <tspan dx="16" font-weight="700">•</tspan>
    <tspan dx="16" font-weight="700" fill="#4F46E5">Zero API Key</tspan> (drive via Claude or Cursor)
  </text>
  <text class="footer-sub" x="480" y="506" text-anchor="middle">Either way, nothing is saved or exported to Anki without your explicit approval.</text>
</svg>
